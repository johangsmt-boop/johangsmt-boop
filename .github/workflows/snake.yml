# À placer dans ton dépôt de profil sous : .github/workflows/snake.yml
# Génère chaque jour un serpent animé (noir & or) à partir de tes contributions
# et le publie sur une branche "output".

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"      # tous les jours à minuit (UTC)
  workflow_dispatch:          # permet de le lancer à la main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le serpent
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=D4AF37&color_dots=1a1a1a,3b2f0b,6b5413,9a7b1c,D4AF37

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
